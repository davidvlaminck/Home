repos:
  - id: awv_generic
    name: AWVGeneric
    url: git@github.com:AWV-AIM-BIM/AWVGeneric.git
    path: ../AWVGeneric
    description: Generic library for AWV API's and reusable functions
    language: Python
    status: active
    deployable: false
    code_quality: false

    labels:
      - backend

  - id: rsa
    name: RSA
    url: git@github.com:davidvlaminck/RSA.git
    path: ../RSA
    description: Reporting services. Uses databases to generate reports and send them to the sharepoint site.
    language: Python
    status: active
    deployable: false
    code_quality: false
    labels:
      - backend
      - reporting

    depends_on:
      - repo: awv_generic
        type: vendors
      - repo: arango_db
        type: uses
      - repo: postgis
        type: uses

  - id: arango_db
    name: ArangoDB
    url: git@github.com:davidvlaminck/InfraDbToArangoDb.git
    path: ../InfraDbToArangoDb
    description: uses the Infra DB API to get the data and store it in an ArangoDB database.
    language: Python
    status: active
    deployable: false
    code_quality: false
    labels:
      - backend
      - database

    depends_on:
      - repo: awv_generic
        type: vendors

  - id: arango_db_to_postgis
    name: ArangoDB to PostGIS
    url: git@github.com:davidvlaminck/ArangoDbToPostGIS.git
    path: ../ArangoDbToPostGIS
    description: uses the ArangoDB database to create a PostGIS database with the same data.
    language: Python
    status: active
    deployable: false
    code_quality: false
    labels:
      - backend
      - database

    depends_on:
      - repo: arango_db
        type: uses

  - id: postgis
    name: PostGIS
    url: git@github.com:davidvlaminck/AWVInfraPostGISSyncer.git
    path: ../AWVInfraPostGISSyncer
    description: uses the Infra DB API to get the data and store it in a PostGIS database.
    language: Python
    status: active
    deployable: false
    code_quality: false
    labels:
      - backend
      - database

  - id: model
    name: OTLMOW-Model
    url: git@github.com:davidvlaminck/OTLMOW-Model.git
    path: ../OTLMOW-Model
    description: Python implementation of the OTL data model. Validates the data against the model.
    language: Python
    status: active
    deployable: true
    code_quality: false
    labels:
      - backend

  - id: modelbuilder
    name: OTLMOW-ModelBuilder
    url: git@github.com:davidvlaminck/OTLMOW-ModelBuilder.git
    path: ../OTLMOW-ModelBuilder
    description: Generates the dynamic code for the OTLMOW-Model repository based on the OTL SQLite and GA.
    language: Python
    status: active
    deployable: true
    code_quality: false
    labels:
      - backend
    depends_on:
      - repo: model
        type: generates

  - id: converter
    name: OTLMOW-Converter
    url: git@github.com:davidvlaminck/OTLMOW-Converter.git
    path: ../OTLMOW-Converter
    description: Loads and saves data in different formats. Converts data from one format to another. Uses the OTLMOW-Model to validate objects holding the data.
    language: Python
    status: active
    deployable: true
    code_quality: false
    labels:
      - backend
    depends_on:
      - repo: model
        type: uses

  - id: template
    name: OTLMOW-Template
    url: git@github.com:davidvlaminck/OTLMOW-Template.git
    path: ../OTLMOW-Template
    description: Creates a template
    language: Python
    status: active
    deployable: true
    code_quality: false
    labels:
      - backend
    depends_on:
      - repo: modelbuilder
        type: uses
      - repo: converter
        type: uses

  - id: otl-wizard
    name: OTLMOW-GUI
    url: git@github.com:davidvlaminck/OTLMOW-GUI.git
    path: ../OTLMOW-GUI
    description: OTL Wizard. GUI to create templates and relations.
    language: Python
    status: active
    deployable: true
    code_quality: false
    labels:
      - frontend
    depends_on:
      - repo: model
        type: uses
      - repo: converter
        type: uses
      - repo: template
        type: uses
      - repo: visuals
        type: uses

  - id: visuals
    name: OTLMOW-Visuals
    url: git@github.com:davidvlaminck/OTLMOW-Visuals.git
    path: ../OTLMOW-Visuals
    description: Creates HTML visualizations for the OTL data.
    language: Python
    status: active
    deployable: true
    code_quality: false
    labels:
      - frontend
    depends_on:
      - repo: model
        type: uses

  - id: otl_dotnotation_maker
    name: OTL_DotnotationMaker (Ruben)
    url: https://github.com/rudewi/OTL_DotnotationMaker/tree/main
    description: Custom script to generate dotnotations from the OTL to use dynamo scripts. (Ruben)
    language: Python
    status: active
    deployable: false
    code_quality: false
    labels:
      - backend
    depends_on:
      - repo: model
        type: vendors
      - repo: converter
        type: vendors
