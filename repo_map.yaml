repos:
  - id: awv_generic
    name: AWVGeneric
    url: git@github.com:AWV-AIM-BIM/AWVGeneric.git
    path: ../AWVGeneric
    description: Generic library for AWV API's and reusable functions
    language: Python
    status: active
    deployable: false
    code_quality: false

    labels:
      - backend

  - id: rsa
    name: RSA
    url: git@github.com:davidvlaminck/RSA.git
    path: ../RSA
    description: Reporting services. Uses databases to generate reports and send them to the sharepoint site.
    language: Python
    status: active
    deployable: false
    code_quality: false
    labels:
      - backend
      - reporting

    depends_on:
      - repo: awv_generic
        type: vendors
      - repo: arango_db
        type: uses
      - repo: postgis
        type: uses

  - id: arango_db
    name: ArangoDB
    url: git@github.com:davidvlaminck/InfraDbToArangoDb.git
    path: ../InfraDbToArangoDb
    description: uses the Infra DB API to get the data and store it in an ArangoDB database.
    language: Python
    status: active
    deployable: false
    code_quality: false
    labels:
      - backend
      - database

    depends_on:
      - repo: awv_generic
        type: vendors

  - id: arango_db_to_postgis
    name: ArangoDB to PostGIS
    url: git@github.com:davidvlaminck/ArangoDbToPostGIS.git
    path: ../ArangoDbToPostGIS
    description: uses the ArangoDB database to create a PostGIS database with the same data.
    language: Python
    status: active
    deployable: false
    code_quality: false
    labels:
      - backend
      - database

    depends_on:
      - repo: arango_db
        type: uses

  - id: postgis
    name: PostGIS
    url: git@github.com:davidvlaminck/AWVInfraPostGISSyncer.git
    path: ../AWVInfraPostGISSyncer
    description: uses the Infra DB API to get the data and store it in a PostGIS database.
    language: Python
    status: active
    deployable: false
    code_quality: false
    labels:
      - backend
      - database
